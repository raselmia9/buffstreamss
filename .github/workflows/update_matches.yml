name: Update Match JSON

on:
  scheduled:
    - cron: '*/30 * * * *' # প্রতি ৩০ মিনিট পর পর স্ক্রিপ্টটি রান হবে (আপনার প্রয়োজনমতো সময় পরিবর্তন করতে পারেন)
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push if there are changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update matches.json [skip ci]" && git push)
